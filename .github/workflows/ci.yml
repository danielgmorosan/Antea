name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: action-setup reads "packageManager" from
      # package.json, and fails outright if pnpm is specified in both places.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        working-directory: pipeline
        run: pip install -e . pytest ruff

      - name: Lint
        working-directory: pipeline
        run: ruff check . && ruff format --check .

      - name: Test
        working-directory: pipeline
        run: pytest

      # Proves the committed artifacts match what the pipeline produces from
      # the recorded fixtures, so a change to the mapping cannot land without
      # its regenerated output.
      - name: Ingest artifacts are current
        working-directory: pipeline
        run: python -m antea_pipeline.cli --check --fixtures tests/fixtures
