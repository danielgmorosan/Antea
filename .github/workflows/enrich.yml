name: Enrich places from Wikidata

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"   # monthly refresh

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node pipeline/enrich-wikidata.mjs

      - name: Commit the refreshed index
        run: |
          if git diff --quiet apps/web/lib/places-auto.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "antea-pipeline"
          git config user.email "pipeline@users.noreply.github.com"
          git add apps/web/lib/places-auto.json
          git commit -m "pipeline: refresh places-auto.json from Wikidata"
          git pull --rebase origin main
          git push
